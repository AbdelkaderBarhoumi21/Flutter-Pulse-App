name: flutter_pulse_app
description: "Pulse - a task manager with real-time push notifications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Networking
  dio: ^5.9.2

  # Routing
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # Local notifications (foreground + tap handling fallback)
  flutter_local_notifications: ^21.0.0

  # Storage
  shared_preferences: ^2.5.6

  # UI, motion & responsiveness
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0

  # Utilities
  equatable: ^2.0.8
  dartz: ^0.10.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
